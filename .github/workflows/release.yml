name: FORGE-OS release ISO

on:
  push:
    tags: ['v2.5.0-beta']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 1, path: FORGE-OS }
      - name: Resolve exact FORGE source
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < FORGE-OS/VERSION)"
          forge_ref="$(tr -d '[:space:]' < FORGE-OS/FORGE_REF)"
          [[ "$version" = 2.5.0-beta && "$forge_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "forge_ref=$forge_ref" >> "$GITHUB_OUTPUT"

      - name: Require private FORGE checkout token
        env:
          FORGE_REPO_TOKEN: ${{ secrets.FORGE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FORGE_REPO_TOKEN" || {
            echo "Missing FORGE_REPO_TOKEN repository secret; it must grant read access to the private FORGE repository." >&2
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          repository: North3rnLight3r/FORGE
          ref: ${{ steps.inputs.outputs.forge_ref }}
          path: FORGE
          token: ${{ secrets.FORGE_REPO_TOKEN }}
      - name: Verify exact FORGE source and Hermes bridge contract
        run: FORGE_SOURCE="$GITHUB_WORKSPACE/FORGE" bash ./FORGE-OS/tests/hermes-runtime-contract.sh
      - name: Build fresh ISO in Arch container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged -v "$GITHUB_WORKSPACE:/work" -w /work archlinux:base-devel bash -lc '
            set -euo pipefail
            pacman -Syu --noconfirm git nodejs-lts-jod npm python rust systemd desktop-file-utils pacman-contrib greetd sudo archiso squashfs-tools libxcrypt-compat
            git config --global --add safe.directory /work/FORGE-OS
            git config --global --add safe.directory /work/FORGE
            git clone --branch 0.11.0 --depth 1 https://github.com/tuigreet/tuigreet.git /tmp/tuigreet
            cargo build --locked --release --manifest-path /tmp/tuigreet/Cargo.toml -p tuigreet
            install -Dm755 /tmp/tuigreet/target/release/tuigreet /usr/local/bin/tuigreet
            install -d /usr/share/forge-os
            printf "repository=https://github.com/tuigreet/tuigreet.git\nversion=0.11.0\ncommit=%s\n" "$(git -C /tmp/tuigreet rev-parse HEAD)" > /usr/share/forge-os/tuigreet-source.env
            bash /work/FORGE-OS/scripts/clean-build.sh
            bash /work/FORGE-OS/scripts/build-forge.sh /work/FORGE
            bash /work/FORGE-OS/scripts/build-iso.sh
            chmod -R a+rX /work/FORGE-OS/build/iso
          '
      - name: Verify and publish ISO
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.inputs.outputs.version }}'
          mapfile -t isos < <(find FORGE-OS/build/iso -maxdepth 1 -type f -name '*.iso' -print)
          test "${#isos[@]}" -eq 1
          release_dir="$RUNNER_TEMP/forge-os-release"
          mkdir -p "$release_dir"
          name="forge-os-${version}-x86_64.iso"
          asset_files=()
          if (( $(stat -c '%s' "${isos[0]}") >= 2000000000 )); then
            split_prefix="$release_dir/$name.part-"
            split --bytes=1900M --numeric-suffixes=0 --suffix-length=2 "${isos[0]}" "$split_prefix"
            mapfile -t parts < <(find "$release_dir" -maxdepth 1 -type f -name "$name.part-*" -print | sort)
            test "${#parts[@]}" -gt 1
            checksum="$release_dir/$name.parts.sha256"
            (cd "$release_dir"; : > "$checksum"; for part in "${parts[@]}"; do sha256sum "$(basename "$part")" >> "$checksum"; done; sha256sum -c "$checksum")
            instructions="$release_dir/$name.REASSEMBLE.txt"
            printf 'Reassemble the ISO with: cat %s.part-* > %s\nVerify with: sha256sum -c %s.parts.sha256\n' "$name" "$name" "$name" > "$instructions"
            asset_files=("${parts[@]}" "$checksum" "$instructions")
          else
            cp "${isos[0]}" "$release_dir/$name"
            (cd "$release_dir" && sha256sum "$name" > "$name.sha256" && sha256sum -c "$name.sha256")
            test -s "$release_dir/$name"
            asset_files=("$release_dir/$name" "$release_dir/$name.sha256")
          fi
          notes="FORGE-OS 2.5.0-beta bundling FORGE 2.5.0-beta. Fixes complete artifact-context telemetry, tool/task activity indicators, and system sounds across the shared runtime. FORGE-OS commit $GITHUB_SHA; FORGE commit ${{ steps.inputs.outputs.forge_ref }}."
          if gh release view v2.5.0-beta --repo North3rnLight3r/FORGE-OS >/dev/null 2>&1; then
            gh release upload v2.5.0-beta "${asset_files[@]}" --repo North3rnLight3r/FORGE-OS --clobber
            gh release edit v2.5.0-beta --repo North3rnLight3r/FORGE-OS --title "FORGE-OS 2.5.0-beta" --prerelease --notes "$notes"
          else
            gh release create v2.5.0-beta "${asset_files[@]}" --repo North3rnLight3r/FORGE-OS --verify-tag --title "FORGE-OS 2.5.0-beta" --prerelease --notes "$notes"
          fi
