name: Verify FORGE-OS source contract

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install validation dependencies
        run: |
          pacman -Syu --noconfirm git nodejs-lts-jod npm python rust systemd desktop-file-utils pacman-contrib greetd sudo
          sed -i '/^#\[multilib\]$/,/^#Include = \/etc\/pacman.d\/mirrorlist$/ { s/^#\[multilib\]$/[multilib]/; s|^#Include = /etc/pacman.d/mirrorlist$|Include = /etc/pacman.d/mirrorlist|; }' /etc/pacman.conf
          pacman -Sy --noconfirm

      - uses: actions/checkout@v7
        with:
          path: FORGE-OS

      - name: Require private FORGE checkout token
        env:
          FORGE_REPO_TOKEN: ${{ secrets.FORGE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FORGE_REPO_TOKEN" || {
            echo "Missing FORGE_REPO_TOKEN repository secret; it must grant read access to the private FORGE repository." >&2
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          repository: North3rnLight3r/FORGE
          ref: main
          path: FORGE
          token: ${{ secrets.FORGE_REPO_TOKEN }}

      - name: Verify current FORGE checkout
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git -C FORGE rev-parse HEAD)"
          echo "FORGE source: $(git -C FORGE rev-parse HEAD)"

      - name: Verify shared native Ollama Hermes bridge contract
        run: FORGE_SOURCE="$GITHUB_WORKSPACE/FORGE" bash ./FORGE-OS/tests/hermes-runtime-contract.sh

      - name: Build canonical tuigreet 0.11.0
        run: |
          git clone --branch 0.11.0 --depth 1 https://github.com/tuigreet/tuigreet.git /tmp/tuigreet
          test "$(git -C /tmp/tuigreet rev-parse HEAD)" = 6fb15fffb794c6bd357164347d8b6d9e0aa92bbc
          cargo build --locked --release --manifest-path /tmp/tuigreet/Cargo.toml -p tuigreet
          install -Dm755 /tmp/tuigreet/target/release/tuigreet /usr/local/bin/tuigreet
          /usr/local/bin/tuigreet --version 2>&1 | grep -F -- '0.11.0'
          /usr/local/bin/tuigreet --help 2>&1 | grep -F -- '--background'
          /usr/local/bin/tuigreet --help 2>&1 | grep -F -- '--kb-background'
          /usr/local/bin/tuigreet --help 2>&1 | grep -F -- '--doom-height'
          /usr/local/bin/tuigreet --help 2>&1 | grep -F -- '--matrix-length'

      - name: Install locked FORGE dependencies
        run: npm --prefix FORGE ci

      - name: Verify greeter package contract
        run: TUIGREET_BIN=/usr/local/bin/tuigreet bash ./FORGE-OS/tests/greeter-contract.sh

      - name: Verify live setup and clean install contract
        run: FORGE_SOURCE="$GITHUB_WORKSPACE/FORGE" bash ./FORGE-OS/tests/clean-install-contract.sh

      - name: Verify Advanced maintenance and rollback contract
        run: FORGE_SOURCE="$GITHUB_WORKSPACE/FORGE" bash ./FORGE-OS/tests/maintenance-contract.sh

      - name: Verify complete source contract
        run: FORGE_SOURCE="$GITHUB_WORKSPACE/FORGE" TUIGREET_BIN=/usr/local/bin/tuigreet ./FORGE-OS/tests/source-verify.sh
